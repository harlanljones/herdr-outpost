[project]
name = "herdr-outpost-relay"
version = "0.1.0"
description = "Async daemon relay and gateway for herdr-outpost"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "websockets>=14.0",
    "pywebpush>=2.0.0",
    "py-vapid>=1.9.0",
    "python-telegram-bot>=21.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.sdist]
include = [
    "*.py",
    "*.sh",
    "*.ps1",
    "README.md",
]
