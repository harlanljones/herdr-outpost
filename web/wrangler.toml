name = "herdr-outpost"
compatibility_date = "2026-08-22"

# Cloudflare Workers Static Assets: serves web/ directly with no build step
# and no Worker script required. SPA fallback (not_found_handling) makes deep
# links like /session/{id} serve index.html. Deploy with `wrangler deploy`
# from this directory.
[assets]
directory = "."
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"
